server:
  address: ${BIND_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  shutdown: graceful
spring:
  application:
    name: taskforge
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/taskforge;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 12
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  rabbitmq:
    host: ${RABBIT_HOST:127.0.0.1}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    connection-timeout: 3s
    requested-heartbeat: 10s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  lifecycle:
    timeout-per-shutdown-phase: 25s
  task:
    scheduling:
      pool:
        size: 3
management:
  health:
    rabbit:
      enabled: ${RABBIT_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true
    local-cache-scope: STATEMENT
    cache-enabled: false
    jdbc-type-for-null: 'NULL'
taskforge:
  rabbit:
    enabled: ${RABBIT_ENABLED:false}
    publish-ms: 100
  api-key: ${TASKFORGE_API_KEY:local-development-key}
  worker-enabled: ${WORKER_ENABLED:true}
  node-id: ${NODE_ID:${random.uuid}}
  concurrency: ${WORKER_CONCURRENCY:4}
  lease-seconds: ${LEASE_SECONDS:30}
  poll-ms: ${POLL_MS:500}
